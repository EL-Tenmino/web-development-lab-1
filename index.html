<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэлийн форм</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">

    <!-- External CSS файл -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-card">
        <span class="badge">Лаборатори 03</span>

        <h1 class="form-title">Бүртгүүлэх</h1>
        <p class="form-description">Доорх мэдээллийг бөглөнө үү.</p>

        <form action="#" method="get">
            <div class="form-group">
                <label class="form-label" for="fullname">Овог, нэр</label>
                <input class="form-input" type="text" id="fullname"
                       name="fullname" placeholder="Нэрээ оруулна уу"
                       autocomplete="name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">И-мэйл</label>
                <input class="form-input" type="email" id="email"
                       name="email" placeholder="example@gmail.com"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Нууц үг</label>
                <input class="form-input" type="password" id="password"
                       placeholder="8-аас дээш тэмдэгт"
                       autocomplete="new-password" minlength="8" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="birthday">Төрсөн огноо</label>
                <input class="form-input" type="date" id="birthday"
                       name="birthday">
            </div>

            <div class="form-group">
                <label class="form-label" for="major">Мэргэжил</label>
                <select class="form-input" id="major" name="major" required>
                    <option value="">Мэргэжлээ сонгоно уу</option>
                    <option value="information-systems">Мэдээллийн систем</option>
                    <option value="software">Программ хангамж</option>
                    <option value="network">Компьютерын сүлжээ</option>
                </select>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" name="terms" required>
                Үйлчилгээний нөхцөлийг зөвшөөрч байна.
            </label>

            <div class="button-group">
                <button class="btn btn-primary" type="submit">
                    Бүртгүүлэх
                </button>
                <button class="btn btn-secondary" type="reset">
                    Цэвэрлэх
                </button>
            </div>
        </form>
    </main>
</body>
</html>
